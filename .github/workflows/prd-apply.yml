name: Deploy Frontend PRD

on:
  push:
    branches:
      - main

env:
  TF_VAR_env: "prd"
      
jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: dojo-frontend/package-lock.json

      - name: Install dependencies
        working-directory: dojo-frontend
        run: npm ci

      - name: Build
        working-directory: dojo-frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL_PRD }}
          VITE_API_ID: ${{ secrets.API_ID_PRD }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Deploy to S3
        working-directory: dojo-frontend
        run: |
          aws s3 sync dist/ s3://dojo-frontend-prd --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html"
          
          aws s3 cp dist/index.html s3://dojo-frontend-prd/index.html \
            --cache-control "public, max-age=300, must-revalidate"